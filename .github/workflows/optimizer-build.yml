name: Optimizer APK
on:
  push:
    branches: [optimizer-pro-max]
    paths: ['optimizer/**', '.github/workflows/optimizer-build.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p optimizer assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ThienDao-Optimizer-debug
          path: optimizer/app/build/outputs/apk/debug/*.apk
