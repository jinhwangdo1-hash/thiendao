name: AutoClick Pro Max Windows EXE
on:
  push:
    branches: [autoclick-pro-max-windows]
    paths:
      - 'autoclick-pc/**'
      - '.github/workflows/autoclick-windows.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: autoclick-pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Package EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name AutoClickProMax main.py
      - uses: actions/upload-artifact@v4
        with:
          name: AutoClickProMax-Windows-EXE
          path: autoclick-pc/dist/AutoClickProMax.exe
          if-no-files-found: error
