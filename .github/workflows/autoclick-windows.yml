name: Build AutoClick Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [autoclick-pro-max]
    paths:
      - 'autoclick/**'
      - '.github/workflows/autoclick-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pyautogui pynput pyinstaller
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name AutoClickProMax autoclick/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: AutoClickProMax-Windows-EXE
          path: dist/AutoClickProMax.exe
