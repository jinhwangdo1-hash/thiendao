name: Build Co Lau Auto Windows
on:
  push:
    branches: [co-lau-auto-windows]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r co-lau-auto/requirements.txt
      - name: Build
        working-directory: co-lau-auto
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name ThienDao_CoLau_Auto main.py
      - uses: actions/upload-artifact@v4
        with:
          name: ThienDao_CoLau_Auto_Windows
          path: co-lau-auto/dist/ThienDao_CoLau_Auto/
