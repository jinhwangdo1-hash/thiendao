name: Auto Macro APK
on:
  push:
    branches: [auto-macro]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p auto-macro assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AutoMacroProMax-APK
          path: auto-macro/app/build/outputs/apk/debug/*.apk